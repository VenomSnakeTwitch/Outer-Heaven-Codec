<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Outer Heaven Codec</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Auth Screen -->
    <div id="auth-screen">
        <div class="auth-box">
            <h2 id="auth-title">Outer Heaven - Login</h2>
            <input type="text" id="username" placeholder="Benutzername">
            <input type="password" id="passwort" placeholder="Passwort">
            <input type="password" id="admin-secret-input" placeholder="Admin-Schlüssel (optional)" style="display:none;">
            <button id="auth-submit-btn" onclick="handleAuth()">Einloggen</button>
            <button class="switch-btn" id="switch-mode-btn" onclick="toggleAuthMode()">Noch kein Konto? Registrieren</button>
        </div>
    </div>

    <!-- Haupt-App Linke Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">OUTER HEAVEN</div>
        <div class="channels-list">
            <div class="section-title">Textkanäle</div>
            <div id="text-channels">
                <div class="channel-item active" onclick="switchChannel('text', 'allgemein')"># allgemein</div>
            </div>
            <div class="section-title">Sprachkanäle</div>
            <div id="voice-channels">
                <div class="channel-item" onclick="joinVoiceChannel('Lobby')">🔊 Lobby</div>
            </div>
        </div>

        <div class="user-panel">
            <div class="user-info" onclick="openSettings()" style="cursor: pointer;" title="Einstellungen öffnen">
                <div id="user-avatar-disp" class="avatar-container"></div>
                <div class="username" id="user-name-disp">Lade...</div>
            </div>
            <button class="logout-btn" onclick="logout()">X</button>
        </div>
    </div>

    <!-- Chat & Hauptbereich -->
    <div class="main-content">
        <div class="chat-header">
            <span id="current-channel-title"># allgemein</span>
            <button id="leave-voice-btn" class="control-btn active" style="display:none; margin-left: auto;" onclick="leaveVoiceChannel()">Verbindung verlassen</button>
        </div>

        <div id="chat-messages" class="chat-messages"></div>
        <div id="video-grid" style="display: none;"></div>

        <div class="chat-input-area" id="chat-input-area-box" style="display: flex; gap: 5px; padding: 10px;">
            <div class="chat-input-wrapper" style="display: flex; gap: 5px; width: 100%;">
                <input type="text" id="msg-input" placeholder="Nachricht senden..." onkeydown="checkSend(event)" style="flex: 1;">
                <button class="send-btn" onclick="sendMessage()">Senden</button>
            </div>
        </div>
    </div>

    <!-- Rechte Sidebar für Online-Nutzer & Admin-Menü -->
    <div class="sidebar" style="border-left: 1px solid #202225; border-right: none; width: 220px;">
        <div class="sidebar-header" style="font-size: 13px;">Online Benutzer</div>
        
        <!-- Admin-Zusatzmenü (wird nur für Admins eingeblendet) -->
        <div id="admin-sidebar-panel" style="padding: 10px; background: #25272a; border-bottom: 1px solid #202225; display: none;">
            <div class="section-title" style="margin: 0 0 5px 0; color: #f1c40f;">Admin-Verwaltung</div>
            <button onclick="adminUpdateUserRolePrompt()" style="width: 100%; background: #e67e22; border: none; color: white; padding: 6px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold;">Ränge verwalten</button>
        </div>

        <div class="channels-list" style="padding: 5px;">
            <div id="online-users-list" style="display: flex; flex-direction: column; gap: 2px;">
                <!-- Wird dynamisch gefüllt -->
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
